# Arma la APK "Max Pizza" en GitHub (este PC no tiene Android/Java).
# Necesita los secretos VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY (Settings → Secrets → Actions).
name: APK Max Pizza
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: app/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Max-Pizza.apk
      - uses: actions/upload-artifact@v4
        with: { name: Max-Pizza-APK, path: app/Max-Pizza.apk }
      - name: Publicar en Releases (enlace fijo para descargar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Max Pizza · versión ${{ github.run_number }}
          files: app/Max-Pizza.apk
          make_latest: true
